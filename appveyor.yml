version: 1.0.{build}
image: Visual Studio 2022
clone_depth: 1
init:
- ps: ''
environment:
  BOOST_ROOT: C:\Libraries\boost_1_85_0
  MYSQL_ROOT_DIR: C:\Program Files\MySQL\MySQL Server 8.0
  OPENSSL_ROOT_DIR: C:\OpenSSL-v32-Win64
build_script:
- cmd: >-
    git config user.email "appveyor@build.bot" && git config user.name "AppVeyor"

    git submodule init
    
    git submodule update
    
    cmake -S . -B .\build -G"Visual Studio 17 2022" -A x64 -DSCRIPTS=dynamic -DWITH_WARNINGS_AS_ERRORS=OFF -DTOOLS=OFF

    cd build

    "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe" /nologo /m:2 /p:Configuration=Release /p:Platform="X64" /verbosity:minimal /logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll" "Ctulhunet.ru.sln"

    cd bin\Release\

    copy "%MYSQL_ROOT_DIR%\lib\libmysql.dll" libmysql.dll

    copy "%OPENSSL_ROOT_DIR%\libssl-3-x64.dll" libssl-3-x64.dll

    copy "%OPENSSL_ROOT_DIR%\libcrypto-3-x64.dll" libcrypto-3-x64.dll

    copy "%OPENSSL_ROOT_DIR%\bin\legacy.dll" legacy.dll

    cd ..

    7z a TrinityCoreWin64VS2022.zip .\Release\*

    del /F /Q /S "Release\*.pdb" > NUL

    7z a TrinityCoreWin64VS2022NoSymbols.zip .\Release\*

test: off
artifacts:
- path: build\bin\TrinityCoreWin64VS2022.zip
  name: TrinityCoreWin64VS2022

- path: build\bin\TrinityCoreWin64VS2022NoSymbols.zip
  name: TrinityCoreWin64VS2022NoSymbols
